<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>R Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: indigo adire header band, then a three-column studio (quest list | code bench | R's answer) that stacks on phones. */
  :root {
    --indigo: #1E2A78;
    --indigo-2: #2E3FA3;
    --sun: #FFC233;
    --coral: #F0563A;
    --leaf: #1F9D63;
    --ink: #1A1D33;
    --muted: #565C80;
    --paper: #F3F5FC;
    --card: #FFFFFF;
    --line: #D8DDF0;
    --soft: #E9ECFA;
    --code-bg: #14183A;
    --code-fg: #E8EAF7;
    --t-comment: #8A92C4;
    --t-string: #FFD27A;
    --t-number: #7CE0B0;
    --t-key: #FF9C85;
    --t-fn: #8FC1FF;
    --t-op: #FFC233;
    --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
    --font-body: "Nunito", "Segoe UI", system-ui, sans-serif;
    --font-code: "JetBrains Mono", ui-monospace, "Courier New", monospace;
    --r-lg: 18px;
    --r-md: 12px;
    --r-sm: 8px;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* ---------- Header band ---------- */
  .band {
    background-color: var(--indigo);
    background-image:
      radial-gradient(circle at 12px 12px, rgba(255,255,255,0.16) 3px, transparent 4px),
      radial-gradient(circle at 36px 36px, transparent 7px, rgba(255,255,255,0.10) 8px, rgba(255,255,255,0.10) 9px, transparent 10px);
    background-size: 48px 48px;
    color: #fff;
  }
  .band-inner {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px 0;
  }
  .top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .owl { font-size: 34px; line-height: 1; display: inline-block; }
  .owl.happy { animation: bounce .55s; }
  .owl.sad { animation: shake .5s; }
  @keyframes bounce { 50% { transform: translateY(-9px) rotate(-10deg); } }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .brand h1 {
    margin: 0; font-family: var(--font-display); font-weight: 800;
    font-size: 30px; line-height: 1; letter-spacing: .3px;
  }
  .brand h1 span { color: var(--sun); }
  .who { font-size: 13px; opacity: .85; margin-top: 2px; }
  .hud { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px; padding: 5px 12px; font-weight: 800; font-size: 14px;
    font-variant-numeric: tabular-nums; color: #fff;
  }
  button.pill:hover { background: rgba(255,255,255,.24); }
  .level-pill { gap: 8px; }
  .level-bar { width: 64px; height: 8px; border-radius: 99px; background: rgba(255,255,255,.22); overflow: hidden; }
  .level-bar i { display: block; height: 100%; width: 0; background: var(--sun); border-radius: 99px; transition: width .5s; }

  .tabs { display: flex; gap: 4px; margin-top: 12px; overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; border: 0; background: rgba(255,255,255,.12); color: #fff;
    padding: 10px 16px; border-radius: 14px 14px 0 0; font-weight: 800; font-size: 14px;
  }
  .tab:hover { background: rgba(255,255,255,.22); }
  .tab[aria-selected="true"] { background: var(--paper); color: var(--indigo); }

  /* ---------- Studio ---------- */
  .studio {
    display: grid; grid-template-columns: 270px minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 24px;
    align-items: start;
  }
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg);
    padding: 14px; min-width: 0; display: flex; flex-direction: column; gap: 12px;
  }
  .panel-title {
    margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 18px;
    color: var(--indigo); line-height: 1.2; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .count { font-family: var(--font-body); font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
  .track-bar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
  .track-bar i { display: block; height: 100%; background: var(--leaf); width: 0; transition: width .5s; }

  .list { display: flex; flex-direction: column; gap: 6px; max-height: calc(100vh - 230px); overflow-y: auto; padding-right: 2px; }
  .item {
    display: grid; grid-template-columns: 28px minmax(0,1fr) auto; align-items: center; gap: 8px;
    width: 100%; text-align: left; border: 2px solid transparent; background: var(--soft);
    border-radius: var(--r-md); padding: 8px 10px; font-weight: 700; font-size: 14px; color: var(--ink);
  }
  .item:hover { border-color: var(--indigo-2); }
  .item[aria-current="true"] { background: #FFF3CF; border-color: var(--sun); }
  .item .ic { font-size: 19px; text-align: center; }
  .item .nm { min-width: 0; overflow-wrap: anywhere; }
  .item .tag { font-size: 11px; font-weight: 800; border-radius: 99px; padding: 2px 7px; white-space: nowrap; }
  .tag.pts { background: #E7E3FF; color: #4A33B5; }
  .tag.done { background: #D6F3E4; color: #11663F; }
  .tag.num { background: transparent; color: var(--muted); font-variant-numeric: tabular-nums; }

  .prompt {
    background: #EEF1FF; border-radius: var(--r-md); padding: 12px 14px; font-size: 15px;
    border: 1px solid #D5DBFA;
  }
  .prompt.challenge { background: #F4EEFF; border-color: #DCCFFB; }
  .prompt .goal { display: block; margin-top: 6px; font-weight: 800; color: #4A33B5; font-size: 14px; }
  .prompt .pretend { display: inline-block; margin-top: 6px; font-size: 12px; font-weight: 800; color: var(--muted); }
  .hint-box {
    background: #FFF6DA; border: 1px dashed #E2B23A; border-radius: var(--r-md);
    padding: 10px 12px; font-size: 14px;
  }
  .hint-box code { font-family: var(--font-code); font-size: 13px; overflow-wrap: anywhere; }

  .mode { display: inline-flex; background: var(--soft); border-radius: 99px; padding: 3px; gap: 2px; align-self: flex-start; }
  .mode button { border: 0; background: transparent; padding: 6px 14px; border-radius: 99px; font-weight: 800; font-size: 13px; color: var(--muted); }
  .mode button[aria-pressed="true"] { background: var(--card); color: var(--indigo); box-shadow: 0 1px 0 var(--line); }

  /* game inputs */
  .play-bar {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px;
    background: #FFF8E6; border: 1px solid #F3DFA6; border-radius: var(--r-md); padding: 10px 12px;
  }
  .field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .field label { font-size: 12px; font-weight: 800; color: var(--muted); }
  .field input {
    border: 2px solid var(--line); border-radius: var(--r-sm); padding: 6px 9px; width: 130px;
    max-width: 100%; background: var(--card); font-weight: 700;
  }
  .field input[type="number"] { width: 90px; }
  .choice { border: 2px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 14px; font-weight: 800; }
  .choice:hover { border-color: var(--coral); }
  .tries { font-size: 13px; font-weight: 800; color: var(--muted); align-self: center; font-variant-numeric: tabular-nums; }

  /* editor */
  .editor {
    display: grid; grid-template-columns: 40px minmax(0,1fr); background: var(--code-bg);
    border-radius: var(--r-md); overflow: hidden; height: 300px; min-height: 200px;
  }
  .gutter {
    background: rgba(255,255,255,.04); color: #5E6699; font-family: var(--font-code); font-size: 14px;
    line-height: 22px; padding: 12px 8px 12px 0; text-align: right; overflow: hidden; user-select: none; white-space: pre;
    font-variant-numeric: tabular-nums;
  }
  .code-area { position: relative; min-width: 0; }
  .code-area pre, .code-area textarea {
    position: absolute; inset: 0; margin: 0; padding: 12px; border: 0;
    font-family: var(--font-code); font-size: 14px; line-height: 22px; tab-size: 2;
    white-space: pre; overflow: auto; background: transparent;
  }
  .code-area pre { color: var(--code-fg); pointer-events: none; }
  .code-area textarea {
    color: transparent; caret-color: var(--sun); resize: none; outline: none; -webkit-text-fill-color: transparent;
  }
  .code-area textarea::selection { background: rgba(255,194,51,.35); }
  .t-c { color: var(--t-comment); font-style: italic; }
  .t-s { color: var(--t-string); }
  .t-n { color: var(--t-number); }
  .t-k { color: var(--t-key); font-weight: 600; }
  .t-f { color: var(--t-fn); }
  .t-o { color: var(--t-op); font-weight: 600; }

  .keys { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
  .keys button {
    flex: 0 0 auto; font-family: var(--font-code); font-weight: 600; font-size: 14px;
    min-width: 38px; height: 36px; padding: 0 10px; border-radius: var(--r-sm);
    border: 1px solid var(--line); background: var(--soft); color: var(--indigo);
  }
  .keys button:hover { background: #DDE2FA; }

  /* blocks */
  .blocks { background: #F7F8FE; border: 1px solid var(--line); border-radius: var(--r-md); padding: 10px; display: flex; flex-direction: column; gap: 10px; min-height: 240px; }
  .palette { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 10px; border-bottom: 2px dashed var(--line); }
  .blk { border: 0; color: #fff; font-weight: 800; font-size: 13px; padding: 7px 12px; border-radius: var(--r-sm); }
  .blk:hover { filter: brightness(1.08); }
  .b-print { background: #2E6FD8; } .b-math { background: #1F9D63; } .b-var { background: #D9860B; }
  .b-plot { background: #D9412A; } .b-loop { background: #7B4BD1; }
  .stack { display: flex; flex-direction: column; gap: 6px; }
  .stack .empty { color: var(--muted); text-align: center; padding: 22px 8px; font-size: 14px; }
  .brow { display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 8px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 6px 8px; }
  .brow .lab { color: #fff; font-weight: 800; font-size: 12px; border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
  .brow input { min-width: 0; width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-family: var(--font-code); font-size: 13px; }
  .brow .x { border: 0; background: transparent; color: var(--coral); font-weight: 800; font-size: 16px; padding: 2px 6px; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn {
    border: 0; border-radius: var(--r-md); padding: 10px 18px; font-weight: 800; font-size: 15px;
    display: inline-flex; align-items: center; gap: 6px; transition: transform .08s;
  }
  .btn:active { transform: translateY(2px); }
  .btn-run { background: var(--leaf); color: #fff; box-shadow: 0 3px 0 #13744A; }
  .btn-run[aria-busy="true"] { opacity: .75; }
  .btn-2 { background: var(--soft); color: var(--indigo); box-shadow: 0 3px 0 var(--line); }
  .btn-hint { background: #FFE7A6; color: #6A4A00; box-shadow: 0 3px 0 #E6C35E; }
  .kbd { font-size: 12px; color: var(--muted); align-self: center; }

  /* output */
  .status { border-radius: var(--r-sm); padding: 7px 10px; font-size: 13px; font-weight: 800; }
  .status.loading { background: #FFF4D1; color: #7A5600; }
  .status.ready { background: #D6F3E4; color: #11663F; }
  .status.down { background: #FFE3DC; color: #9A2C14; }
  .loading-bar { height: 4px; border-radius: 99px; background: #FBE6A6; overflow: hidden; margin-top: 6px; }
  .loading-bar i { display: block; height: 100%; width: 35%; background: #E2A600; border-radius: 99px; animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
  .out {
    background: var(--code-bg); color: var(--code-fg); border-radius: var(--r-md); padding: 12px;
    font-family: var(--font-code); font-size: 13.5px; line-height: 1.55; white-space: pre-wrap;
    overflow-wrap: anywhere; min-height: 120px; max-height: 300px; overflow: auto;
  }
  .oops {
    background: #FFF0EC; border: 1px solid #F8C6B8; border-radius: var(--r-md); padding: 12px 14px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .oops strong { color: #A3341B; font-family: var(--font-display); font-size: 17px; line-height: 1.2; }
  .oops p { margin: 0; }
  .oops code { font-family: var(--font-code); font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .down-card { background: #FFF0EC; border: 1px solid #F8C6B8; border-radius: var(--r-md); padding: 12px 14px; font-size: 14px; }
  .down-card p { margin: 0 0 6px; }
  .down-card p:last-child { margin: 0; }
  .plots { display: flex; flex-direction: column; gap: 10px; }
  .plot-wrap { display: flex; flex-direction: column; gap: 8px; }
  .plot-wrap canvas { width: 100%; height: auto; border-radius: var(--r-md); border: 1px solid var(--line); background: #fff; }
  .plot-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn-sm { padding: 7px 12px; font-size: 13px; }
  a.btn { text-decoration: none; }

  /* ---------- My stuff ---------- */
  .stuff {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 28px;
    display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px; align-items: start;
  }
  .profile { align-items: center; text-align: center; }
  .big-ava { font-size: 64px; line-height: 1; }
  .profile h2 { margin: 0; font-family: var(--font-display); font-size: 26px; color: var(--indigo); line-height: 1.1; }
  .lvl-name { font-weight: 800; color: var(--coral); }
  .stat-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; width: 100%; }
  .stat { background: var(--soft); border-radius: var(--r-md); padding: 10px 6px; }
  .stat b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1.1; color: var(--indigo); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; font-weight: 800; color: var(--muted); }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .badge { border-radius: var(--r-md); padding: 12px; background: var(--soft); text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; }
  .badge .bi { font-size: 32px; line-height: 1; }
  .badge b { font-size: 14px; line-height: 1.2; }
  .badge small { font-size: 12px; color: var(--muted); line-height: 1.3; }
  .badge.locked .bi { filter: grayscale(1); opacity: .35; }
  .badge.locked b { color: var(--muted); }
  .badge.got { background: #FFF3CF; border: 1px solid #F3D477; }
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .gallery figure { margin: 0; background: var(--soft); border-radius: var(--r-md); padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .gallery img { width: 100%; border-radius: var(--r-sm); background: #fff; display: block; }
  .gallery figcaption { font-size: 12px; font-weight: 800; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .gallery figcaption button { border: 0; background: transparent; color: var(--coral); font-weight: 800; padding: 0 4px; }
  .empty-note { color: var(--muted); font-size: 14px; margin: 0; }
  .danger { background: transparent; border: 1px solid #F1B5A6; color: #A3341B; border-radius: var(--r-md); padding: 8px 14px; font-weight: 800; }
  .confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; font-size: 14px; }

  /* ---------- Overlays ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 50; background: rgba(20,24,58,.55);
    display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  }
  .sheet {
    background: var(--card); border-radius: 22px; padding: 22px; width: 100%; max-width: 440px;
    display: flex; flex-direction: column; gap: 14px; max-height: 100%; overflow-y: auto;
  }
  .sheet h2 { margin: 0; font-family: var(--font-display); font-size: 28px; line-height: 1.1; color: var(--indigo); text-wrap: balance; }
  .sheet p { margin: 0; color: var(--muted); }
  .sheet label.lbl { font-weight: 800; font-size: 14px; }
  .sheet input[type="text"] { width: 100%; border: 2px solid var(--line); border-radius: var(--r-md); padding: 10px 12px; font-weight: 700; font-size: 16px; }
  .err-text { color: #B3341B; font-size: 13px; font-weight: 800; }
  .avas { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
  .avas button { font-size: 30px; border: 2px solid var(--line); background: var(--soft); border-radius: var(--r-md); padding: 6px 0; }
  .avas button[aria-pressed="true"] { border-color: var(--sun); background: #FFF3CF; }
  .langs { display: flex; gap: 8px; }
  .langs button { flex: 1; border: 2px solid var(--line); background: var(--soft); border-radius: var(--r-md); padding: 8px; font-weight: 800; }
  .langs button[aria-pressed="true"] { border-color: var(--indigo-2); background: #E4E8FF; color: var(--indigo); }

  .celebrate { position: fixed; inset: 0; z-index: 60; pointer-events: none; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cbox { background: var(--card); border: 4px solid var(--sun); border-radius: 24px; padding: 22px 34px; text-align: center; animation: pop .4s; }
  @keyframes pop { 0% { transform: scale(0); } 80% { transform: scale(1.08); } }
  .cbox .big { font-size: 52px; line-height: 1; }
  .cbox .msg { font-family: var(--font-display); font-size: 24px; font-weight: 800; color: var(--coral); margin-top: 6px; }
  .cbox .pts { font-weight: 800; color: var(--leaf); font-size: 18px; }
  .confetti { position: absolute; top: -12px; width: 10px; height: 10px; animation: fall 2.1s linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); } }
  .toast {
    position: fixed; z-index: 70; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    background: var(--indigo); color: #fff; border-radius: 16px; padding: 10px 16px; font-weight: 800;
    display: flex; align-items: center; gap: 10px; max-width: calc(100% - 32px); animation: rise .35s;
  }
  .toast .bi { font-size: 28px; }
  @keyframes rise { from { transform: translate(-50%, 20px); opacity: 0; } }

  @media (max-width: 1100px) {
    .studio { grid-template-columns: 240px minmax(0,1fr); }
    .studio .output { grid-column: 1 / -1; }
  }
  @media (max-width: 760px) {
    .studio { grid-template-columns: minmax(0,1fr); }
    .list { flex-direction: row; max-height: none; overflow-x: auto; overflow-y: hidden; padding-bottom: 4px; }
    .item { width: auto; flex: 0 0 auto; grid-template-columns: 24px auto auto; }
    .item .nm { white-space: nowrap; }
    .stuff { grid-template-columns: minmax(0,1fr); }
    .brand h1 { font-size: 26px; }
    .editor { height: 260px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
</head>
<body>


<header class="band">
  <div class="band-inner">
    <div class="top">
      <div class="brand">
        <span class="owl" id="owl" aria-hidden="true">🦉</span>
        <div>
          <h1 id="brand">R <span>Quest</span></h1>
          <div class="who" id="who"></div>
        </div>
      </div>
      <div class="hud">
        <span class="pill level-pill" title="Level"><span id="lvl-label">Lv 1</span><span class="level-bar"><i id="lvl-bar"></i></span></span>
        <span class="pill" title="Stars">⭐ <span id="stars">0</span></span>
        <span class="pill" title="Streak">🔥 <span id="streak">0</span></span>

let actx = null;
function tone(freqs, dur = 0.12, type = 'triangle', gap = 0.09) {
  if (!S.sound) return;
  try {
    actx ||= new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      const t0 = actx.currentTime + i * gap;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.18, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    });
  } catch {}
}

  win: () => tone([523, 659, 784, 1047], 0.18),

/* ---------- editor ---------- */
const ta = $('code'), hl = $('hl'), gutter = $('gutter');
function highlight(src) {
  const re = /(#[^\n]*)|("(?:\\.|[^"\\\n])*"?|'(?:\\.|[^'\\\n])*'?)|(\b\d+(?:\.\d+)?\b)|(\b(?:if|else|for|while|repeat|function|in|break|next|return|TRUE|FALSE|NULL|NA)\b)|([A-Za-z_.][A-Za-z0-9_.]*)(?=\s*\()|(<-|->|%%|%in%|==|!=|>=|<=|&&|\|\|)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const c = m[1] ? 'c' : m[2] ? 's' : m[3] ? 'n' : m[4] ? 'k' : m[5] ? 'f' : 'o';
    out += `<span class="t-${c}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last)) + '\n';
}
function paint() {
  hl.innerHTML = highlight(ta.value);
  const n = ta.value.split('\n').length;
  gutter.textContent = Array.from({ length: n }, (_, i) => i + 1).join('\n');
  syncScroll();
}
function syncScroll() {
  hl.parentElement.scrollTop = ta.scrollTop; hl.parentElement.scrollLeft = ta.scrollLeft;
  gutter.scrollTop = ta.scrollTop;
}
function setCode(v) { ta.value = v; paint(); }
ta.addEventListener('input', () => { paint(); if (tab === 'free' && item) { S.free[item.id] = ta.value; save(); } });
ta.addEventListener('scroll', syncScroll);
ta.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); return; }
  if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); insertAtCursor('  '); }
});
function insertAtCursor(text, back = 0) {
  ta.focus();
  ta.setRangeText(text, ta.selectionStart, ta.selectionEnd, 'end');
  if (back) { const p = ta.selectionStart - back; ta.setSelectionRange(p, p); }
  ta.dispatchEvent(new Event('input'));
}

/* ---------- game inputs ---------- */
function rLiteralFor(input, raw) {
  if (input.type === 'number') {
    let n = Math.round(Number(raw)); if (!Number.isFinite(n)) n = input.min ?? 1;
    if (input.min != null) n = Math.max(input.min, n); if (input.max != null) n = Math.min(input.max, n);
    return String(n);
  }
  return '"' + String(raw).replace(/["\\]/g, '').slice(0, 40) + '"';
}
function setVar(name, literal) {
  const re = new RegExp('^(\\s*' + name.replace(/\./g, '\\.') + '\\s*<-\\s*)[^\\n#]*', 'm');
  if (re.test(ta.value)) setCode(ta.value.replace(re, (_, p) => p + literal + (literal.length ? ' ' : '')).replace(/ +(\n|$)/g, '$1'));
}
function readVar(name) {
  const m = ta.value.match(new RegExp('^\\s*' + name.replace(/\./g, '\\.') + '\\s*<-\\s*("([^"]*)"|[^\\n#]+)', 'm'));
  if (!m) return '';
  return m[2] !== undefined ? m[2] : m[1].trim();
}
function renderPlayBar() {
  const bar = $('play-bar');
  const inputs = (tab === 'games' && item && item.inputs) || [];
  if (!inputs.length) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  bar.innerHTML = inputs.map((inp, i) => {
    if (inp.type === 'number' || inp.type === 'text') {
      const id = `in-${item.id}-${inp.name}`;
      return `<div class="field"><label for="${id}">${esc(pick(inp, 'label'))}</label><input id="${id}" data-i="${i}" type="${inp.type === 'number' ? 'number' : 'text'}" ${inp.min != null ? `min="${inp.min}"` : ''} ${inp.max != null ? `max="${inp.max}"` : ''} value="${esc(readVar(inp.name))}"></div>`;
    }
    if (inp.type === 'choice') return inp.options.map(o => `<button type="button" class="choice" data-choice="${esc(o.v)}" data-i="${i}">${esc(S.lang === 'yo' ? o.l_yo : o.l)}</button>`).join('');
    if (inp.type === 'seed') return `<button type="button" class="btn btn-2 btn-sm" data-seed="1">${esc(tr(inp.label))}</button>`;
    if (inp.type === 'tries') return `<span class="tries" id="tries">${esc(tr('tries'))}: ${tries}</span>`;
    return '';
  }).join('');
}
$('play-bar').addEventListener('input', (e) => {

  const total = items.length, n = items.filter(i => S.done[i.id]).length;
  $('track-count').textContent = tab === 'free' ? '' : `${n}/${total}`;
  $('track-bar').style.width = tab === 'free' ? '0%' : `${total ? (n / total) * 100 : 0}%`;
  $('track-bar').parentElement.hidden = tab === 'free';
}
$('list').addEventListener('click', (e) => {
  const b = e.target.closest('.item'); if (!b) return;
  const it = trackItems().find(x => x.id === b.dataset.id); if (it) { sfx.tap(); load(it); }
});
function load(it) {
  item = it; tries = 0;
  const p = $('prompt');
  p.className = 'prompt' + (tab === 'challenge' ? ' challenge' : '');
  let html = esc(pick(it, 'prompt'));
  if (it.goal) html += `<span class="goal">🎯 ${esc(pick(it, 'goal'))}</span>`;
  if (it.pretend) html += `<span class="pretend">ⓘ ${esc(tr('pretend'))}</span>`;
  p.innerHTML = html;
  const hb = $('hint-box'); hb.hidden = true;
  hb.innerHTML = it.hint ? `<code>${esc(pick(it, 'hint')).replace(/\n/g, '<br>')}</code>` : '';
  $('hint').hidden = !it.hint; $('hint').textContent = tr('hint');
  const code = (it.saved && S.free[it.id] != null) ? S.free[it.id] : (it.starter ?? it.code ?? '');
  setCode(code);
  blocks = []; if (mode === 'blocks') renderBlocks();
  renderPlayBar();
  $('run').textContent = runLabel();
  renderList();
}
const runLabel = () => tab === 'games' ? tr('play') : tab === 'challenge' ? tr('check') : tr('run');
$('reset').addEventListener('click', () => {
  if (!item) return;
  if (item.saved) { delete S.free[item.id]; save(); }
  load(item); clearOutput(); sfx.tap();
});
$('hint').addEventListener('click', () => {
  const hb = $('hint-box'); hb.hidden = !hb.hidden;
  $('hint').textContent = hb.hidden ? tr('hint') : tr('hide_hint');
});

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchTab(t.dataset.tab)));
function switchTab(name) {
  tab = name;
  document.querySelectorAll('.tab').forEach(x => x.setAttribute('aria-selected', String(x.dataset.tab === name)));
  const stuff = name === 'stuff';
  $('studio').hidden = stuff; $('stuff').hidden = !stuff;
  if (stuff) { renderStuff(); return; }
  $('list-title').textContent = tr('title_' + name);
  load(CONTENT[name][0]);
  clearOutput();
}

/* ---------- output ---------- */
function clearOutput() {
  $('out').textContent = rReady ? tr('welcome') : '';
  $('oops').hidden = true; $('plots').innerHTML = '';
}
const ERR = [
  [/object '(.+?)' not found/, (m) => ({
    en: `R doesn't know anything called “${m[1]}” yet. Check the spelling, or create it first with ${m[1]} <- something.`,
    yo: `R kò mọ ohunkóhun tí à ń pè ní “${m[1]}” síbẹ̀. Ṣàyẹ̀wò bí o ṣe kọ ọ́, tàbí kọ́kọ́ ṣẹ̀dá rẹ̀ pẹ̀lú ${m[1]} <- nǹkan.` })],
  [/could not find function "(.+?)"/, (m) => ({
    en: `There is no command called ${m[1]}(). Check the spelling. R cares about capital letters, so Print is not the same as print.`,
    yo: `Kò sí àṣẹ kan tí à ń pè ní ${m[1]}(). Ṣàyẹ̀wò bí o ṣe kọ ọ́. R ń ṣọ́ lẹ́tà ńlá, nítorí náà Print kò jọ print.` })],
  [/unexpected end of input|INCOMPLETE|unexpected end of line/, () => ({
    en: 'Something was opened but never closed. Count your ( ), { } and quote marks. Every opening needs a closing.',
    yo: 'Nǹkan kan ṣí ṣùgbọ́n kò padé. Ka ( ), { } àti àmì ọ̀rọ̀ rẹ. Gbogbo ìṣí nílò ìpadé.' })],
  [/unexpected (symbol|numeric constant|string constant)/, () => ({
    en: 'R found two things side by side with nothing between them. You may have forgotten a comma, a + or a bracket.',
    yo: 'R rí nǹkan méjì tí ó wà lẹ́gbẹ̀ẹ́ ara wọn láìsí nǹkan láàrin wọn. Bóyá o gbàgbé kọ́mà, + tàbí àkámọ́.' })],
  [/unexpected '([)\],}])'|unexpected ','/, () => ({
    en: 'There is an extra bracket or comma somewhere. Look for one that has no partner and remove it.',
    yo: 'Àkámọ́ tàbí kọ́mà kan pọ̀ jù níbì kan. Wá èyí tí kò ní ẹnìkejì kí o sì yọ ọ́ kúrò.' })],
  [/non-numeric argument/, () => ({
    en: 'You tried to do maths with words. Numbers do not need quote marks: write 5, not "5".',
    yo: 'O gbìyànjú láti ṣe ìṣirò pẹ̀lú ọ̀rọ̀. Nọ́mbà kò nílò àmì ọ̀rọ̀: kọ 5, kì í ṣe "5".' })],
  [/argument "(.+?)" is missing/, (m) => ({
    en: `Your command needs a value for “${m[1]}”. Put something inside the brackets.`,
    yo: `Àṣẹ rẹ nílò iye fún “${m[1]}”. Fi nǹkan sínú àkámọ́ náà.` })],
];
function friendly(msg) {
  for (const [re, fn] of ERR) { const m = msg.match(re); if (m) return fn(m)[S.lang] || fn(m).en; }
  return S.lang === 'yo' ? 'R dúró. Ka ohun tí R sọ nísàlẹ̀, yí nǹkan kékeré kan padà, kí o sì gbìyànjú lẹ́ẹ̀kan sí.'
    : 'R got stuck. Read what R said below, change one small thing, and try again.';
}
function showOops(msg) {
  const o = $('oops'); o.hidden = false;
  const raw = msg.replace(/^Error:?\s*(<text>:\d+:\d+:\s*)?/, '');
  o.innerHTML = `<strong>${esc(tr('oops_title'))}</strong><p>${esc(friendly(msg))}</p><code style="white-space:pre-wrap">${esc(tr('r_said'))} ${esc(raw)}</code>`;
}

/* ---------- webR ---------- */
let webR = null, shelter = null, rReady = false, rDown = false, running = false;
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]);
async function bootR() {
  setStatus('loading');
  try {
    const mod = await withTimeout(import(WEBR_BASE + 'webr.mjs'), 20000);
    webR = new mod.WebR({ baseUrl: WEBR_BASE });
    await withTimeout(webR.init(), 120000);
    shelter = await new webR.Shelter();
    rReady = true; setStatus('ready'); clearOutput();
  } catch (e) {
    rDown = true; setStatus('down');
  }
}
function setStatus(s) {
  const st = $('status');
  st.className = 'status ' + s;
  st.textContent = s === 'ready' ? '✓ ' + tr('ready') : s === 'down' ? '⚠ ' + tr('down') : '⏳ ' + tr('loading');
  $('loading-bar').hidden = s !== 'loading';
  const dc = $('down-card');
  dc.hidden = s !== 'down';
  if (s === 'down') dc.innerHTML = `<p>${esc(tr('down_1'))}</p><p>${esc(tr('down_2'))}</p><p>${esc(tr('down_3'))}</p>`;
}

async function run() {
  if (running) return;
  if (!rReady) { $('out').textContent = rDown ? tr('down_2') : tr('not_ready'); sfx.bad(); return; }
  const code = mode === 'blocks' ? blocksToCode() : ta.value;
  if (!code.trim()) { $('out').textContent = tr('no_code'); return; }
  running = true;
  const btn = $('run'); btn.setAttribute('aria-busy', 'true'); btn.textContent = tr('running');
  $('oops').hidden = true; $('plots').innerHTML = ''; $('out').textContent = '';
  let text = '', images = [], err = null, rpass = true;
  try {
    await webR.evalRVoid('rm(list = ls(envir = globalenv(), all.names = TRUE), envir = globalenv())');
    const res = await shelter.captureR(code, { withAutoprint: true, captureStreams: true, captureConditions: false, captureGraphics: { width: 560, height: 420 } });
    const lines = [], errLines = [];
    for (const o of res.output) {
      if (o.type !== 'stdout' && o.type !== 'stderr') continue;
      const d = String(o.data);
      if (o.type === 'stderr' && (errLines.length || /^Error\b/.test(d))) errLines.push(d);
      else lines.push((o.type === 'stderr' ? '⚠ ' : '') + d);
    }
    text = lines.join('\n');
    if (errLines.length) err = errLines.join('\n');
    images = res.images || [];
    if (item?.rcheck) {
      try { rpass = await webR.evalRBoolean(item.rcheck); } catch { rpass = false; }
    }
  } catch (e) {
    err = (e && e.message) ? e.message : String(e);
  } finally {
    try { await shelter.purge(); } catch {}
  }
  $('out').textContent = text || (err ? '' : tr('no_output'));
  images.forEach((img) => addPlot(img));
  if (err) { showOops(err); sfx.bad(); sad(); lastRunFailed = true; }
  else afterSuccess(code, text, images.length, rpass);
  if (tab === 'games' && item?.inputs?.some(i => i.type === 'tries')) { tries++; const t = $('tries'); if (t) t.textContent = `${tr('tries')}: ${tries}`; }
  btn.removeAttribute('aria-busy'); btn.textContent = runLabel();
  running = false;
}
$('run').addEventListener('click', run);

function addPlot(img) {
  const wrap = document.createElement('div'); wrap.className = 'plot-wrap';
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  c.getContext('2d').drawImage(img, 0, 0);
  const title = item ? pick(item, 'title') : 'R Quest';
  c.setAttribute('role', 'img'); c.setAttribute('aria-label', title);
  const acts = document.createElement('div'); acts.className = 'plot-actions';
  const sv = document.createElement('button'); sv.type = 'button'; sv.className = 'btn btn-2 btn-sm'; sv.textContent = tr('save_pic');
  sv.addEventListener('click', () => {
    let url; try { url = c.toDataURL('image/png'); } catch { return; }
    gallery.unshift({ img: url, title, date: Date.now() });
    gallery = gallery.slice(0, 12);
    while (!store.set('rq2-gallery', gallery) && gallery.length > 1) gallery.pop();
    sv.textContent = tr('saved_pic'); sv.disabled = true; sfx.ok();
    if (gallery.length >= 3) award('gallery3');
  });
  const dl = document.createElement('a'); dl.className = 'btn btn-2 btn-sm'; dl.textContent = tr('download_pic');
  dl.download = (title.replace(/[^\w]+/g, '-').toLowerCase() || 'r-quest') + '.png';
  dl.href = '#';
  dl.addEventListener('click', () => { try { dl.href = c.toDataURL('image/png'); } catch {} });
  acts.append(sv, dl);
  wrap.append(c, acts);
  $('plots').append(wrap);
}

/* ---------- rewards ---------- */
function bumpStreak() {
  if (S.lastDay !== today) { S.streak = (S.lastDay === new Date(Date.now() - 864e5).toDateString()) ? S.streak + 1 : 1; S.lastDay = today; }
}
function afterSuccess(code, out, nImages, rpass) {
  award('first_run');
  if (nImages) award('first_plot');
  if (lastRunFailed) award('fixer');
  if (mode === 'blocks') award('blocks');
  lastRunFailed = false;
  if (!item) return happy();
  const first = !S.done[item.id];
  if (tab === 'challenge') {
    const ok = (item.check ? !!item.check(out, code, { images: nImages }) : true) && rpass;
    if (!ok) { $('oops').hidden = false; $('oops').innerHTML = `<strong>🎯 ${esc(tr('not_yet'))}</strong><p>${esc(pick(item, 'goal'))}</p>`; sfx.bad(); sad(); return; }
    if (first) { S.done[item.id] = true; S.stars += item.points; bumpStreak(); celebrate(`+${item.points} ⭐`, tr('challenge_done')); }
    else { happy(); sfx.ok(); }
  } else if (tab === 'learn' && first) {
    S.done[item.id] = true; S.stars += 5; bumpStreak(); celebrate('+5 ⭐', tr('lesson_done'));
  } else if (tab === 'games' && first) {
    S.done[item.id] = true; S.stars += 3; bumpStreak(); celebrate('+3 ⭐', tr('game_done'));
  } else { happy(); sfx.ok(); }
  save(); checkBadges(); updateHud(); renderList();
}
function checkBadges() {
  const n = (k) => CONTENT[k].filter(i => S.done[i.id]).length;
  if (n('learn') >= 5) award('five_lessons');
  if (n('learn') === CONTENT.learn.length) award('all_lessons');
  if (n('challenge') >= 3) award('three_ch');
  if (n('challenge') === CONTENT.challenge.length) award('all_ch');
  if (n('games') >= 5) award('five_games');
  if (S.streak >= 3) award('streak3');
}
let toastTimer = null;
function award(id) {
  if (S.badges[id]) return;
  S.badges[id] = Date.now(); save();
  const b = BADGES.find(x => x.id === id); if (!b) return;
  const t = $('toast');
  t.innerHTML = `<span class="bi" aria-hidden="true">${b.icon}</span><span>${esc(tr('badge_new'))}<br>${esc(b[S.lang][0])}</span>`;
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 3200);
}

/* ---------- HUD ---------- */
function updateHud() {
  const lvl = Math.floor(S.stars / 50) + 1;
  $('stars').textContent = S.stars; $('streak').textContent = S.streak;
  $('lvl-label').textContent = `${S.lang === 'yo' ? 'Ìp' : 'Lv'} ${lvl}`;
  $('lvl-bar').style.width = `${(S.stars % 50) * 2}%`;
  $('who').textContent = S.name ? `${tr('hello')}, ${S.name} ${S.avatar} · ${levelName()}` : '';
  $('sound-btn').textContent = S.sound ? '🔊' : '🔇';
  $('lang-btn').textContent = S.lang === 'en' ? 'Yorùbá' : 'English';
}
const levelName = () => { const names = tr('lvl_names'); return names[Math.min(Math.floor(S.stars / 50), names.length - 1)]; };

/* ---------- My stuff ---------- */
function renderStuff() {
  $('p-ava').textContent = S.avatar; $('p-name').textContent = S.name || '—';
  $('p-level').textContent = `${tr('level')} ${Math.floor(S.stars / 50) + 1} · ${levelName()}`;
  $('p-lvlbar').style.width = `${(S.stars % 50) * 2}%`;
  $('p-stars').textContent = S.stars;
  $('p-done').textContent = Object.keys(S.done).length;
  $('p-badges').textContent = Object.keys(S.badges).length;
  $('p-stars-l').textContent = tr('stars_l'); $('p-done-l').textContent = tr('done_l'); $('p-badges-l').textContent = tr('badges_l');
  $('edit-profile').textContent = tr('edit');
  $('badges-title').textContent = tr('badges_title'); $('gallery-title').textContent = tr('gallery_title');
  $('badges').innerHTML = BADGES.map(b => {
    const got = !!S.badges[b.id];
    return `<div class="badge ${got ? 'got' : 'locked'}"><span class="bi" aria-hidden="true">${b.icon}</span><b>${esc(b[S.lang][0])}</b><small>${esc(b[S.lang][1])}</small></div>`;
  }).join('');
  $('gallery').innerHTML = gallery.length
    ? gallery.map((g, i) => `<figure><img src="${g.img}" alt="${esc(g.title)}"><figcaption><span>${esc(g.title)}</span><button type="button" data-delpic="${i}" aria-label="Delete picture">✕</button></figcaption></figure>`).join('')
    : `<p class="empty-note">${esc(tr('gallery_empty'))}</p>`;
  $('reset-area').innerHTML = `<button class="danger" id="reset-progress" type="button">${esc(tr('start_over'))}</button>`;
}
$('gallery').addEventListener('click', (e) => {
  const d = e.target.closest('[data-delpic]'); if (!d) return;
  gallery.splice(+d.dataset.delpic, 1); store.set('rq2-gallery', gallery); renderStuff();
});
$('reset-area').addEventListener('click', (e) => {
  if (e.target.id === 'reset-progress') {
    $('reset-area').innerHTML = `<div class="confirm"><span>${esc(tr('sure'))}</span><button class="danger" type="button" id="yes-reset">${esc(tr('yes_delete'))}</button><button class="btn btn-2 btn-sm" type="button" id="no-reset">${esc(tr('cancel'))}</button></div>`;
  } else if (e.target.id === 'yes-reset') {
    S.stars = 0; S.streak = 0; S.lastDay = null; S.done = {}; S.badges = {}; S.free = {}; gallery = [];
    save(); store.set('rq2-gallery', gallery); updateHud(); renderStuff();
  } else if (e.target.id === 'no-reset') renderStuff();
});
$('edit-profile').addEventListener('click', () => openOnboard());

/* ---------- onboarding ---------- */
let obAvatar = S.avatar, obLang = S.lang;
function openOnboard() {
  obAvatar = S.avatar; obLang = S.lang;
  $('ob-name').value = S.name || '';
  paintOnboard();
  $('onboard').hidden = false;
  setTimeout(() => $('ob-name').focus(), 50);
}
function paintOnboard() {
  const L = I18N[obLang];
  $('ob-title').textContent = L.ob_title; $('ob-sub').textContent = L.ob_sub;
  $('ob-name-l').textContent = L.ob_name; $('ob-ava-l').textContent = L.ob_ava; $('ob-lang-l').textContent = L.ob_lang;
  $('ob-go').textContent = L.ob_go;
  $('ob-avas').innerHTML = AVATARS.map(a => `<button type="button" data-ava="${a}" aria-pressed="${a === obAvatar}">${a}</button>`).join('');
  $('ob-en').setAttribute('aria-pressed', String(obLang === 'en'));
  $('ob-yo').setAttribute('aria-pressed', String(obLang === 'yo'));
}
$('ob-avas').addEventListener('click', (e) => { const b = e.target.closest('[data-ava]'); if (b) { obAvatar = b.dataset.ava; paintOnboard(); sfx.tap(); } });
document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => { obLang = b.dataset.lang; paintOnboard(); }));
$('ob-name').addEventListener('input', () => { $('ob-err').hidden = true; });
$('onboard-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = $('ob-name').value.trim();
  if (!name) { $('ob-err').textContent = I18N[obLang].ob_err; $('ob-err').hidden = false; $('ob-name').focus(); return; }
  S.name = name; S.avatar = obAvatar;
  const langChanged = S.lang !== obLang; S.lang = obLang; save();
  $('onboard').hidden = true; sfx.win();
  if (langChanged) applyLang(); else { updateHud(); if (tab === 'stuff') renderStuff(); }
});

/* ---------- language ---------- */
function applyLang() {
  document.documentElement.lang = S.lang === 'yo' ? 'yo' : 'en';
  document.querySelectorAll('.tab').forEach(t => { t.textContent = tr('tab_' + t.dataset.tab); });
  $('mode-code').textContent = tr('mode_code'); $('mode-blocks').textContent = tr('mode_blocks');
  $('reset').textContent = tr('reset'); $('kbd').textContent = tr('kbd'); $('out-title').textContent = tr('out_title');
  renderPalette();
  if (S.lang === 'yo') award('yoruba');
  updateHud();
  setStatus(rReady ? 'ready' : rDown ? 'down' : 'loading');
  if (tab === 'stuff') { renderStuff(); return; }
  $('list-title').textContent = tr('title_' + tab);
  if (item) {
    const keep = ta.value; load(item); setCode(keep); renderPlayBar();
  }
  if (mode === 'blocks') renderBlocks();
}
$('lang-btn').addEventListener('click', () => { S.lang = S.lang === 'en' ? 'yo' : 'en'; save(); applyLang(); sfx.tap(); });
$('sound-btn').addEventListener('click', () => { S.sound = !S.sound; save(); updateHud(); sfx.tap(); });

/* ---------- celebrate ---------- */
const owl = $('owl');
function happy() { owl.classList.remove('sad', 'happy'); void owl.offsetWidth; owl.classList.add('happy'); }
function sad() { owl.classList.remove('sad', 'happy'); void owl.offsetWidth; owl.classList.add('sad'); }
function celebrate(pts, msg) {
  const box = $('celebrate');
  $('c-emoji').textContent = ['🎉', '🌟', '🏆', '🚀', '🦉'][Math.floor(Math.random() * 5)];
  $('c-msg').textContent = msg; $('c-pts').textContent = pts;
  box.querySelectorAll('.confetti').forEach(c => c.remove());
  const colors = ['#F0563A', '#FFC233', '#1F9D63', '#2E3FA3', '#9B6BFF'];
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    for (let i = 0; i < 44; i++) {
      const c = document.createElement('i'); c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
      c.style.animationDelay = Math.random() * 0.5 + 's'; c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
      box.append(c);
    }
  }
  box.hidden = false; happy(); sfx.win();
  setTimeout(() => { box.hidden = true; }, 2100);
}

/* ---------- start ---------- */
applyLang();
switchTab('learn');
updateHud();
if (!S.name) openOnboard();
bootR();
</script>
