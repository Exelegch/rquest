name: Weekly database backup

# Saves an encrypted copy of the database every Sunday as a downloadable workflow artifact
# (kept for 90 days). The repository is public, so the backup is encrypted with a passphrase
# that only you know, and nothing is ever committed to the repository.
#
# One-time setup (Settings > Secrets and variables > Actions > New repository secret):
#   SUPABASE_DB_URL     Supabase > Connect > "Session pooler" connection string, with your database password filled in
#   BACKUP_PASSPHRASE   a long passphrase you will keep safe; you need it to open a backup
#
# To open a backup:  gpg --decrypt rquest-backup-DATE.sql.gpg > rquest-backup.sql
on:
  schedule:
    - cron: '41 2 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the secrets are set
        id: check
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASSPHRASE" ]; then
            echo "::notice::Backups are not set up yet. Add SUPABASE_DB_URL and BACKUP_PASSPHRASE as repository secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Dump and encrypt
        if: steps.check.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          day=$(date -u +%Y-%m-%d)
          docker run --rm -e DB_URL postgres:17 sh -c 'pg_dump "$DB_URL" --schema=public --schema=auth --no-owner --no-privileges' > backup.sql
          test -s backup.sql
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 -o "rquest-backup-$day.sql.gpg" backup.sql
          shred -u backup.sql
          ls -la rquest-backup-*.gpg
      - name: Upload the encrypted backup
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rquest-backup
          path: rquest-backup-*.sql.gpg
          retention-days: 90
